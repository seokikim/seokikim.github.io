let timer;const toast=document.querySelector('.toast');document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{let ok=false;try{await navigator.clipboard.writeText(button.dataset.copy);ok=true}catch{const field=document.createElement('textarea');field.value=button.dataset.copy;field.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.append(field);field.focus();field.select();field.setSelectionRange(0,field.value.length);try{ok=document.execCommand('copy')}catch{}field.remove();button.focus({preventScroll:true})}toast.textContent=ok?'복사되었습니다.':'길게 눌러 연락처를 복사해주세요.';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}));
